<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Travel</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="index.html" aria-label="Talking Travel home">
          <span class="logo__script">Talking</span>
          <span class="logo__travel">Travel</span>
        </a>

        <div class="header-menu">
          <nav class="main-nav" aria-label="Main navigation">
            <ul class="main-nav__list">
              <li><a class="main-nav__link main-nav__link--active" href="index.html">Home</a></li>
              <li><a class="main-nav__link" href="#story">Story</a></li>
              <li><a class="main-nav__link" href="#gallery">Gallery</a></li>
              <li><a class="main-nav__link" href="#contact">Contact Us</a></li>
            </ul>
          </nav>

          <button class="menu-button" type="button" aria-label="Open navigation menu">
            <img src="assets/icons/hamburger.svg" alt="">
          </button>

          <span class="header-menu__divider" aria-hidden="true">
            <img src="assets/icons/divider.svg" alt="">
          </span>

          <button class="icon-button" type="button" aria-label="Search">
            <img src="assets/icons/search.svg" alt="">
          </button>

          <button class="icon-button icon-button--profile" type="button" aria-label="Open profile">
            <img src="assets/icons/profile.svg" alt="">
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
